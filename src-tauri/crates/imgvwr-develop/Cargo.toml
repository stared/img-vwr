[package]
name = "imgvwr-develop"
version = "0.1.0"
edition = "2021"
description = "Format-agnostic develop pipeline for imgvwr: tone, colour and analysis over scene-linear pixels."

[dependencies]
imgvwr-core = { path = "../imgvwr-core" }
rayon = "1.12.0"
serde = { workspace = true }
specta = { workspace = true }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imgvwr-raw = { path = "../imgvwr-raw" }
