[package]
name = "imgvwr-hdr"
version = "0.1.0"
edition = "2021"
description = "Exposure-bracket merging for imgvwr: alignment and exposure fusion over decoded frames."

[dependencies]
# Only the buffer types — decoding and encoding stay with the caller, which is
# where the formats are known.
image = { version = "0.25.10", default-features = false }
rayon = "1.12.0"

# The merge_files example reads and writes real files, so it needs codecs.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
