[package]
name = "imgvwr-core"
version = "0.1.0"
edition = "2021"
description = "Pure core logic for imgvwr: scanning, decoding, thumbnails. No Tauri dependency."

[dependencies]
blake3 = "1.8.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
kamadak-exif = "0.6.1"
serde = { workspace = true }
specta = { workspace = true }
webp = "0.3.1"

[dev-dependencies]
tempfile = "3"
