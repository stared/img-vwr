[package]
name = "imgvwr-raw"
version = "0.1.0"
edition = "2021"
description = "RAW format plugin for imgvwr: decodes camera raw files to scene-linear pixels."

[dependencies]
imgvwr-core = { path = "../imgvwr-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", features = ["CFBase", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace", "CGImage"] }
objc2-core-image = { version = "0.3.2", features = ["CIRAWFilter", "CIFilter", "CIContext", "CIImage", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSString", "NSDictionary", "NSValue", "NSGeometry"] }
