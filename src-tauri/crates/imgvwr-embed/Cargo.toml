[package]
name = "imgvwr-embed"
version = "0.1.0"
edition = "2021"
description = "Image/text embedding models for imgvwr (candle). The first compute-plugin crate beside imgvwr-core: the host only sees the model catalog and the Embedder API."

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = "0.4"
tokenizers = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { workspace = true }
serde_json = "1"
specta = { workspace = true }

# Metal kernels only exist on macOS; other platforms fall back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
