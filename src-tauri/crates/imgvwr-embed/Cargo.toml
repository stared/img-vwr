[package]
name = "imgvwr-embed"
version = "0.1.0"
edition = "2021"
description = "Image/text embedding models for imgvwr (candle). The first compute-plugin crate beside imgvwr-core: the host only sees the model catalog and the Embedder API."

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
# The face-identity recognizer (ArcFace-family, ONNX) — a separate runtime
# from candle because no candle port of it exists.
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { workspace = true }
serde_json = "1"
specta = { workspace = true, optional = true }

# Metal kernels only exist on macOS; other platforms fall back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[features]
# TypeScript bindings for the app; the crate itself does not need them.
specta = ["dep:specta"]
