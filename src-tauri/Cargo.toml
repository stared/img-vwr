[workspace]
members = ["crates/imgvwr-core", "crates/imgvwr-embed"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

# Debug-build ML inference is 50-100× slower than release, which makes the
# embedding models unusable in `tauri dev`. Optimize dependencies (candle,
# image codecs) while keeping workspace crates fast to compile and debug.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The embed crate is a leaf that instantiates image/candle generics in its
# own codegen units; unoptimized it costs ~30× per image. It is glue code we
# rarely step through — trade its debuggability for dev-build speed.
[profile.dev.package.imgvwr-embed]
opt-level = 2

[package]
name = "imgvwr"
version = "0.1.0"
description = "An extensible image viewer"
authors = ["Piotr Migdał"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imgvwr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
imgvwr-core = { path = "crates/imgvwr-core" }
imgvwr-embed = { path = "crates/imgvwr-embed" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"
specta = { workspace = true }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
rayon = "1.12.0"
tauri-plugin-mcp-bridge = "0.12.0"
tauri-plugin-http = "2.5.9"

[dev-dependencies]
tempfile = "3.27.0"
